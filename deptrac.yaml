# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: Installer
      collectors:
        - type: directory
          value: src/Installer/.*
    - name: DocGen
      collectors:
        - type: directory
          value: src/DocGen/.*
    - name: Doctest
      collectors:
        - type: directory
          value: src/Doctest/.*
    - name: LocGuard
      collectors:
        - type: directory
          value: src/LocGuard/.*
    - name: TreeGuard
      collectors:
        - type: directory
          value: src/TreeGuard/.*
    - name: PhpStanRule
      collectors:
        - type: directory
          value: src/PhpStan/Rule/.*
    - name: PhpStanExtension
      collectors:
        - type: directory
          value: src/PhpStan/Extension/.*
    - name: PhpStanSupport
      collectors:
        - type: directory
          value: src/PhpStan/Support/.*
    - name: PhpStanThrowType
      collectors:
        - type: directory
          value: src/PhpStan/ThrowType/.*
    - name: PhpStanErrorFormatter
      collectors:
        - type: directory
          value: src/PhpStan/ErrorFormatter/.*
    - name: PhpUnitTestReporter
      collectors:
        - type: directory
          value: src/PhpUnit/TestReporter/.*
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*
  ruleset:
    Installer: ~
    DocGen: ~
    Doctest: ~
    LocGuard: ~
    TreeGuard: ~
    PhpStanRule:
      - PhpStanSupport
      - Doctest
    PhpStanExtension:
      - PhpStanRule
    PhpStanSupport: ~
    PhpStanThrowType: ~
    PhpStanErrorFormatter:
      - Shared
    PhpUnitTestReporter:
      - Shared
    Shared: ~
