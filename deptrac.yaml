# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
    - ./packages
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: Installer
      collectors:
        - type: directory
          value: src/Installer/.*
    - name: DocGen
      collectors:
        - type: directory
          value: packages/docgen-php/src/DocGen/.*
    - name: Doctest
      collectors:
        - type: directory
          value: packages/phpunit-ai-reporter/src/Doctest/.*
    - name: LocGuard
      collectors:
        - type: directory
          value: packages/guard-php/src/LocGuard/.*
    - name: TreeGuard
      collectors:
        - type: directory
          value: packages/guard-php/src/TreeGuard/.*
    - name: DocGuard
      collectors:
        - type: directory
          value: packages/guard-php/src/DocGuard/.*
    - name: PhpStanRule
      collectors:
        - type: directory
          value: packages/phpstan-guard-rules/src/PhpStan/Rule/.*
    - name: PhpStanExtension
      collectors:
        - type: directory
          value: packages/phpstan-guard-rules/src/PhpStan/Extension/.*
    - name: PhpStanSupport
      collectors:
        - type: directory
          value: packages/phpstan-guard-rules/src/PhpStan/Support/.*
    - name: PhpStanThrowType
      collectors:
        - type: directory
          value: packages/phpstan-guard-rules/src/PhpStan/ThrowType/.*
    - name: PhpStanErrorFormatter
      collectors:
        - type: directory
          value: packages/phpstan-ai-formatter/src/PhpStan/ErrorFormatter/.*
    - name: PhpUnitTestReporter
      collectors:
        - type: directory
          value: packages/phpunit-ai-reporter/src/PhpUnit/TestReporter/.*
    - name: Shared
      collectors:
        - type: directory
          value: packages/phpunit-ai-reporter/src/Shared/.*
    - name: Guard
      collectors:
        - type: directory
          value: packages/guard-php/src/Guard/.*
  ruleset:
    Guard:
      - LocGuard
      - TreeGuard
      - DocGuard
    Installer: ~
    DocGen: ~
    Doctest: ~
    LocGuard: ~
    TreeGuard: ~
    DocGuard: ~
    PhpStanRule:
      - PhpStanSupport
      - Doctest
    PhpStanExtension:
      - PhpStanRule
    PhpStanSupport: ~
    PhpStanThrowType: ~
    PhpStanErrorFormatter:
      - Shared
    PhpUnitTestReporter:
      - Shared
    Shared: ~
