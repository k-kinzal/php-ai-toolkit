# Generates the DocGen site and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://k-kinzal.github.io/php-ai-toolkit/.
# See docs/docgen.md for the publishing model and the pull request preview
# workflow this repository does not run.
name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  DOCS_BRANCH: gh-pages

jobs:
  publish:
    name: Generate and publish the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, gd
          # The site links every method to the test cases covering it, which
          # needs a coverage report. pcov is several times faster than Xdebug
          # and produces the same --coverage-xml.
          coverage: pcov

      - name: Select the matching lock file
        run: cp composer.lock.php-8.5 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Restore the DocGen cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/docgen-cache
          key: docgen-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.5') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.5') }}-
            docgen-${{ runner.os }}-

      - name: Generate the coverage report the site reads
        run: composer test:coverage

      # The address the site is published at is what the workflow knows and
      # the command cannot work out, so the job passes it: every page then
      # carries its canonical link and the tags a shared link is rendered from.
      - name: Generate the documentation
        run: |
          set -euo pipefail

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          composer docgen -- --base-url="https://${repository%%/*}.github.io/${repository#*/}"

      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DOCS_BRANCH }}
          path: .docs-branch

      - name: Publish the site
        working-directory: .docs-branch
        run: |
          set -euo pipefail

          # The site owns the root of the branch; the pull request previews
          # under pr/ and a custom Pages domain in CNAME are kept.
          rsync -a --checksum --delete --exclude '/.git/' --exclude '/pr/' --exclude '/CNAME' ../build/docs/ ./

          git add --all
          if git diff --cached --quiet; then
            echo "The ${DOCS_BRANCH} branch already serves this documentation."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "docs: generate from ${GITHUB_SHA}"
          git push origin "HEAD:${DOCS_BRANCH}"
