configuration:
  -
    id: composer.sort-packages
    message: 'Composer configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /config/sort-packages
    level: recommended
    assert:
      equals: true
  -
    id: composer.autoload-check
    message: 'Composer configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/autoload:check
    level: required
    assert:
      equals: composer dump-autoload --optimize --strict-psr --strict-ambiguous
  -
    id: composer.format-check
    message: 'Composer configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/format:check
    level: required
    assert:
      contains: --allow-risky=yes
  -
    id: composer.phpstan
    message: 'Composer configuration field {select} in {file} must {expectation}. Add a phpstan command to the scripts object, for example "phpstan": "phpstan analyse --memory-limit=512M".'
    file: composer.json
    format: json
    select: /scripts/phpstan
    level: required
    assert:
      present: true
  -
    id: composer.compat
    message: 'Composer configuration field {select} in {file} must {expectation}. Add a compat command to the scripts object, for example "compat": "phpcs".'
    file: composer.json
    format: json
    select: /scripts/compat
    level: required
    assert:
      present: true
  -
    id: composer.guard
    message: 'Composer configuration field {select} in {file} must {expectation}. Add a guard command to the scripts object, for example "guard": "guard check".'
    file: composer.json
    format: json
    select: /scripts/guard
    level: required
    assert:
      present: true
  -
    id: composer.deptrac
    message: 'Composer configuration field {select} in {file} must {expectation}. Add a deptrac command to the scripts object, for example "deptrac": "deptrac analyse --config-file=deptrac.yaml".'
    file: composer.json
    format: json
    select: /scripts/deptrac
    level: required
    assert:
      present: true
  -
    id: composer.test-unit
    message: 'Composer configuration field {select} in {file} must {expectation}. Add a test:unit command to the scripts object that runs the project PHPUnit suite, for example "test:unit": "phpunit".'
    file: composer.json
    format: json
    select: /scripts/test:unit
    level: required
    assert:
      present: true
  -
    id: composer.lint-starts-with-autoload
    message: 'Composer configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/lint/0
    level: required
    assert:
      equals: '@autoload:check'
  -
    id: composer.describe-autoload-check
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/autoload:check
    level: required
    assert:
      present: true
  -
    id: composer.describe-format-check
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/format:check
    level: required
    assert:
      present: true
  -
    id: composer.describe-phpstan
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/phpstan
    level: required
    assert:
      present: true
  -
    id: composer.describe-compat
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/compat
    level: required
    assert:
      present: true
  -
    id: composer.describe-guard
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/guard
    level: required
    assert:
      present: true
  -
    id: composer.describe-deptrac
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/deptrac
    level: required
    assert:
      present: true
  -
    id: composer.describe-test-unit
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/test:unit
    level: required
    assert:
      present: true
  -
    id: composer.describe-lint
    message: 'The script description at {select} in {file} must {expectation}. Add a scripts-descriptions entry explaining what the corresponding Composer command checks or generates.'
    file: composer.json
    format: json
    select: /scripts-descriptions/lint
    level: required
    assert:
      present: true
