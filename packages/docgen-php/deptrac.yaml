deptrac:
  paths:
    - ./src
  # DocGenException is shared at the package root and has no component boundary.
  layers:
    - name: Cache
      collectors:
        - type: directory
          value: 'src/DocGen/Cache/.*'
    - name: Parallel
      collectors:
        - type: directory
          value: 'src/DocGen/Parallel/.*'
    - name: Analysis
      collectors:
        - type: directory
          value: 'src/DocGen/Analysis/.*'
    - name: Render
      collectors:
        - type: directory
          value: 'src/DocGen/Render/.*'
    - name: Cli
      collectors:
        - type: directory
          value: 'src/DocGen/Cli/.*'
  ruleset:
    Cache: []
    Parallel: []
    Analysis: [Cache, Parallel]
    Render: [Analysis, Cache, Parallel]
    Cli: [Analysis, Render, Cache]
