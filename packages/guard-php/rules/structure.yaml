structure:
  paths:
    - .
  exclude:
    - .git
    - .idea
    - .claude
    - .agents
    - .codex
    - .cursor
    - .gemini
    - .entire
    - .entrie
    - .phpunit.cache
    - build
    - projects
    - vendor
  directories:
    -
      path: '**'
      deny_dirs:
        - scripts
        - Scripts
    -
      path: src
      allow: []
      max_dirs: 20
    -
      path: tests
      deny_dirs:
        - Fixture
        - Fixtures
        - Support
        - Supports
        - Helper
        - Helpers
        - Bench
        - Fuzz
        - Fuzzing
    -
      path: tests/Unit
      allow: []
    -
      path: 'tests/Unit/**'
      forbid_empty: true
      allow:
        - '*Test.php'
      file_case: pascal
      dir_case: pascal
      max_files: 15
      max_dirs: 20
