configuration:
  -
    id: phpunit9.executionOrder
    file: phpunit9.xml.dist
    format: xml
    select: /phpunit/@executionOrder
    level: required
    assert:
      equals: 'depends,random'
  -
    id: phpunit9.verbose
    file: phpunit9.xml.dist
    format: xml
    select: /phpunit/@verbose
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit9.forceCoversAnnotation
    file: phpunit9.xml.dist
    format: xml
    select: /phpunit/@forceCoversAnnotation
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit9.beStrictAboutCoversAnnotation
    file: phpunit9.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutCoversAnnotation
    level: required
    assert:
