deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: Rector
      collectors:
        - type: directory
          value: src/Rector/.*
    - name: PhpStanRule
      collectors:
        - type: directory
          value: src/PhpStan/Rule/.*
    - name: PhpStanExtension
      collectors:
        - type: directory
          value: src/PhpStan/Extension/.*
    - name: PhpStanSupport
      collectors:
        - type: directory
          value: src/PhpStan/Support/.*
    - name: PhpStanThrowType
      collectors:
        - type: directory
          value: src/PhpStan/ThrowType/.*
  ruleset:
    Rector:
      - PhpStanRule
      - PhpStanSupport
    PhpStanRule:
      - PhpStanSupport
    PhpStanExtension:
      - PhpStanRule
    PhpStanSupport: ~
    PhpStanThrowType: ~
