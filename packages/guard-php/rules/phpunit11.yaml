    id: phpunit11.beStrictAboutChangesToGlobalState
    message: 'PHPUnit configuration field {select} in {file} must {expectation}. {fix}'
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutChangesToGlobalState
    level: required
    assert:
      equals: 'true'
