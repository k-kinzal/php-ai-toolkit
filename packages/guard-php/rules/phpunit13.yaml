configuration:
  -
    id: phpunit13.beStrictAboutChangesToGlobalState
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutChangesToGlobalState
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit13.beStrictAboutOutputDuringTests
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutOutputDuringTests
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit13.beStrictAboutTestsThatDoNotTestAnything
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutTestsThatDoNotTestAnything
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit13.enforceTimeLimit
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@enforceTimeLimit
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit13.timeoutForSmallTests
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@timeoutForSmallTests
    level: required
    assert:
      equals: '1'
  -
    id: phpunit13.timeoutForMediumTests
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@timeoutForMediumTests
    level: required
    assert:
      equals: '10'
  -
    id: phpunit13.timeoutForLargeTests
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@timeoutForLargeTests
    level: required
    assert:
      equals: '60'
  -
    id: phpunit13.executionOrder
    file: phpunit.xml.dist
    format: xml
    select: /phpunit/@executionOrder
    level: required
    assert:
      equals: 'depends,random'
