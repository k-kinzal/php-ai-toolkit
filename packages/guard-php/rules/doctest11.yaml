configuration:
  -
    id: doctest11.suite
    message: 'Doctest configuration field {select} in {file} must {expectation}. {fix}'
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/testsuites/testsuite[@name="doctest"]/file
    level: required
    assert:
      contains: src/Doctest/DoctestSuite.php
    repair: vendor/k-kinzal/doctest-php/src/Doctest/DoctestSuite.php
  -
    id: doctest11.extension
    message: 'Doctest configuration field {select} in {file} must {expectation}. {fix}'
    file: phpunit11.xml.dist
    format: xml
    select: '/phpunit/extensions/bootstrap[@class="Toolkit\Doctest\DoctestExtension"]/@class'
    level: required
    assert:
      equals: 'Toolkit\Doctest\DoctestExtension'
  -
    id: doctest11.directories
    message: 'Doctest source directories at {select} in {file} must {expectation}. {fix}'
    file: phpunit11.xml.dist
    format: xml
    select: '/phpunit/extensions/bootstrap[@class="Toolkit\Doctest\DoctestExtension"]/parameter[@name="directories"]/@value'
    level: required
    assert:
      present: true
    repair: src
