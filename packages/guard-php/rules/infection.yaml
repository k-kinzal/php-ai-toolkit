configuration:
  -
    id: infection.min-msi
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: infection.json5
    format: json5
    select: /minMsi
    level: required
    assert:
      equals: 80
  -
    id: infection.min-covered-msi
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: infection.json5
    format: json5
    select: /minCoveredMsi
    level: required
    assert:
      equals: 80
  -
    id: infection.default-mutators
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: infection.json5
    format: json5
    select: /mutators/@default
    level: required
    assert:
      equals: true
  -
    id: infection.timeouts-as-escaped
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: infection.json5
    format: json5
    select: /timeoutsAsEscaped
    level: required
    assert:
      equals: true
