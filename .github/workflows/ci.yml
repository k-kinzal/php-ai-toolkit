name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, gd
          coverage: none

      - name: Select the matching lock file
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Run the tests
        run: composer test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, gd
          coverage: none

      - name: Select the matching lock file
        run: cp composer.lock.php-8.5 composer.lock

      - name: Validate the Composer manifest against the lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Check the formatting
        run: composer format:check

      - name: Analyse with PHPStan
        run: composer phpstan

      - name: Check PHP compatibility
        run: composer compat

      - name: Check the source metrics
        run: composer loc-guard

      - name: Check the directory structure
        run: composer tree-guard

      - name: Check the architecture layers
        run: composer deptrac

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, gd
          coverage: pcov

      - name: Select the matching lock file
        run: cp composer.lock.php-8.5 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=85
          --min-covered-msi=85
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --no-progress
          --logger-github
