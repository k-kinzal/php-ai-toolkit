configuration:
  -
    id: phpunit10.beStrictAboutChangesToGlobalState
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutChangesToGlobalState
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.beStrictAboutOutputDuringTests
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutOutputDuringTests
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.beStrictAboutTestsThatDoNotTestAnything
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutTestsThatDoNotTestAnything
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.enforceTimeLimit
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@enforceTimeLimit
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.timeoutForSmallTests
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@timeoutForSmallTests
    level: required
    assert:
      equals: '1'
  -
    id: phpunit10.timeoutForMediumTests
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@timeoutForMediumTests
    level: required
    assert:
      equals: '10'
  -
    id: phpunit10.timeoutForLargeTests
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@timeoutForLargeTests
    level: required
    assert:
      equals: '60'
  -
    id: phpunit10.executionOrder
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@executionOrder
    level: required
    assert:
      equals: 'depends,random'
  -
    id: phpunit10.requireCoverageMetadata
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@requireCoverageMetadata
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.beStrictAboutCoverageMetadata
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutCoverageMetadata
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.failOnAllIssues
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@failOnAllIssues
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.displayDetailsOnAllIssues
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/@displayDetailsOnAllIssues
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.reporter
    file: phpunit10.xml.dist
    format: xml
    select: '/phpunit/extensions/bootstrap[@class="Toolkit\PhpUnit\TestReporter\AiTestReporterExtension"]/@class'
    level: required
    assert:
      equals: 'Toolkit\PhpUnit\TestReporter\AiTestReporterExtension'
  -
    id: phpunit10.restrictDeprecations
    file: phpunit10.xml.dist
    format: xml
    select: /phpunit/source/@restrictDeprecations
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit10.restrictNotices
    file: phpunit10.xml.dist
