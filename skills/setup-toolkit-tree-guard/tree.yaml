paths:
  - '.'

exclude:
  - '.git'
  - '.idea'
  - 'build'
  - 'node_modules'
  - 'var'
  - 'vendor'

rules:
  - path: '**'
    deny_dirs: ['scripts', 'Scripts']
  - path: 'src/**'
    forbid_empty: true
    allow: ['*.php']
    file_case: pascal
    dir_case: pascal
    max_files: 25
    max_dirs: 20

report:
  reporter: ai
  order_by:
    - path
    - rule
