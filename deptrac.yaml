deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: Installer
      collectors:
        - type: directory
          value: src/Installer/.*
    - name: LocGuard
      collectors:
        - type: directory
          value: src/LocGuard/.*
    - name: TreeGuard
      collectors:
        - type: directory
          value: src/TreeGuard/.*
    - name: PhpStanRule
      collectors:
        - type: directory
          value: src/PhpStan/Rule/.*
    - name: PhpStanSupport
      collectors:
        - type: directory
          value: src/PhpStan/Support/.*
    - name: PhpStanThrowType
      collectors:
        - type: directory
          value: src/PhpStan/ThrowType/.*
    - name: PhpStanErrorFormatter
      collectors:
        - type: directory
          value: src/PhpStan/ErrorFormatter/.*
    - name: PhpUnitTestReporter
      collectors:
        - type: directory
          value: src/PhpUnit/TestReporter/.*
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*
  ruleset:
    Installer: ~
    LocGuard: ~
    TreeGuard: ~
    PhpStanRule:
      - PhpStanSupport
    PhpStanSupport: ~
    PhpStanThrowType: ~
    PhpStanErrorFormatter:
      - Shared
    PhpUnitTestReporter:
      - Shared
    Shared: ~
