structure:
  paths:
    - .
  exclude:
    - vendor
    - .git
  directories:
    -
      path: 'tests/Property/**'
      forbid_empty: true
      allow:
        - '*Properties.php'
      file_case: pascal
      dir_case: pascal
      max_files: 15
      max_dirs: 20
configuration:
  -
    id: pbt.test-unit
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/test:unit
    level: required
    assert:
      contains: '--testsuite=unit'
  -
    id: pbt.test-pbt
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/test:pbt
    level: required
    assert:
      contains: '--testsuite=property'
