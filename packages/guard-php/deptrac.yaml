deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: LocGuard
      collectors:
        - type: directory
          value: src/LocGuard/.*
    - name: TreeGuard
      collectors:
        - type: directory
          value: src/TreeGuard/.*
    - name: DocGuard
      collectors:
        - type: directory
          value: src/DocGuard/.*
    - name: Guard
      collectors:
        - type: directory
          value: src/Guard/.*
  ruleset:
    Guard:
      - LocGuard
      - TreeGuard
      - DocGuard
    LocGuard: ~
    TreeGuard: ~
    DocGuard: ~
