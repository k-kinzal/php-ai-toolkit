# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
paths:
  - '.'

exclude:
  - '.git'
  - '.idea'
  - 'build'
  - 'node_modules'
  - 'var'
  - 'vendor'

rules:
  - path: '**'
    deny_dirs: ['scripts', 'Scripts']
  - path: 'REPLACE_WITH_PRODUCTION_ROOT/**'
    forbid_empty: true
    allow: ['*.php']
    file_case: pascal
    dir_case: pascal
    max_files: 15
    max_dirs: 20
  - path: 'REPLACE_WITH_UNIT_TEST_ROOT/**'
    forbid_empty: true
    allow: ['*Test.php']
    file_case: pascal
    dir_case: pascal
    max_files: 15
    max_dirs: 20

report:
  reporter: ai
  order_by:
    - path
    - rule
