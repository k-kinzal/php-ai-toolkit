name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            test-script: test:unit:legacy
          - php: '8.1'
            test-script: test:unit
          - php: '8.2'
            test-script: test:unit
          - php: '8.3'
            test-script: test:unit
          - php: '8.4'
            test-script: test:unit
          - php: '8.5'
            test-script: test:unit
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, gd
          coverage: none

      - name: Select the matching lock file
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Run the unit tests
        run: composer ${{ matrix.test-script }}

  tests-parallel:
    name: Tests through the parallel runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, gd
          coverage: none

      - name: Select the matching lock file
        run: cp composer.lock.php-8.4 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Run the suite under ParaTest
        run: composer test

  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd
          coverage: none

      - name: Select the matching lock file
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Validate the Composer manifest against the lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Check the formatting
        run: composer format:check

      - name: Analyse with PHPStan
        run: composer phpstan

      - name: Check compatibility with the PHP floor
        run: composer compat

      - name: Check the source metrics
        run: composer loc-guard

      - name: Check the directory structure
        run: composer tree-guard

      - name: Check the namespace visibility
        run: composer scope-guard

      - name: Check the architecture layers
        run: composer deptrac

  doctest:
    name: Doctest on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd
          coverage: none

      - name: Select the matching lock file
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Run the documented examples
        run: composer doctest

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, gd
          coverage: pcov

      - name: Select the matching lock file
        run: cp composer.lock.php-8.4 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Generate coverage for mutation testing
        run: >-
          php -d memory_limit=1G vendor/bin/phpunit
          --configuration phpunit.xml.dist
          --no-extensions
          --do-not-fail-on-risky
          --coverage-xml build/infection-coverage/coverage-xml
          --log-junit build/infection-coverage/junit.xml

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=1G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=85
          --min-covered-msi=85
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=1G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --no-progress
          --logger-github
