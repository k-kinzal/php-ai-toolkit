configuration:
  -
    id: pbt.test-unit
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/test:unit
    level: required
    assert:
      contains: '--exclude-group=pbt'
  -
    id: pbt.test-pbt
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/test:pbt
    level: required
    assert:
      contains: '--group=pbt'
