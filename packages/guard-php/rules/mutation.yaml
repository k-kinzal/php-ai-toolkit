configuration:
  -
    id: mutation.permissions
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: .github/workflows/mutation.yml
    format: yaml
    select: /permissions/contents
    level: required
    assert:
      equals: read
  -
    id: mutation.min-msi
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: .github/workflows/mutation.yml
    format: yaml
    select: /jobs/mutation
    level: required
    assert:
      contains: '--min-msi=0'
  -
    id: mutation.min-covered-msi
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: .github/workflows/mutation.yml
    format: yaml
    select: /jobs/mutation
    level: required
    assert:
      contains: '--min-covered-msi=0'
  -
    id: mutation.threshold
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: .github/workflows/mutation.yml
    format: yaml
    select: /jobs/mutation
    level: required
    assert:
      contains: MIN_MSI=80
  -
    id: mutation.covered-threshold
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: .github/workflows/mutation.yml
    format: yaml
    select: /jobs/mutation
    level: required
    assert:
      contains: MIN_COVERED_MSI=80
