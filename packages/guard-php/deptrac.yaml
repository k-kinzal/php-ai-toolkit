deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'
  layers:
    - name: Foundation
      collectors:
        - type: directory
          value: 'src/Config/(Value|Reader|Profile|Validation)/.*'
        - type: directory
          value: 'src/Config/(Configuration|Schema)\.php'
        - type: directory
          value: 'src/Document/.*'
        - type: directory
          value: 'src/Collect/[^/]+(?<!Collector)\.php'
        - type: directory
          value: 'src/Collect/Filesystem/(Entry|Path)\.php'
        - type: directory
          value: 'src/Collect/Matching/PathPatternMatcher\.php'
        - type: directory
          value: 'src/Execution/(Context|Plan|FileChange)\.php'
        - type: directory
          value: 'src/Extension/PolicyBinding\.php'
        - type: directory
          value: 'src/Policy/(Policy|PolicyException|Constraint|Rule)\.php'
        - type: directory
          value: 'src/Reporting/[^/]+(?<!Reporter)\.php'
        - type: directory
          value: 'src/Structure/(Subject|Structurer|Source|ParsedDocument)\.php'
    - name: Collection
      collectors:
        - type: directory
          value: 'src/Collect/Collector\.php'
        - type: directory
          value: 'src/Collect/Filesystem/(?!Entry\.php|Path\.php).*'
        - type: directory
          value: 'src/Collect/Matching/(GlobMatcher|SelectionFilter|ScopeMatcher)\.php'
        - type: directory
          value: 'src/Execution/TargetPath\.php'
    - name: Structuring
      collectors:
        - type: directory
          value: 'src/Structure/(Php|Markdown)/.*'
        - type: directory
          value: 'src/Structure/(DocumentStructurer|TextStructurer|Text)\.php'
    - name: Policy
      collectors:
        - type: directory
          value: 'src/Policy/(Comparison|Inspection|Limit)/.*'
        - type: directory
          value: 'src/Policy/(MetricLimits|DirectoryEntries|HeadingStructure|FieldConstraints|RuleEvaluator)\.php'
        - type: directory
          value: 'src/Config/Assignment/.*'
    - name: Configuration
      collectors:
        - type: directory
          value: 'src/Config/(ConfigurationLoader|ImportResolver|DocumentMerger|RuleReader)\.php'
    - name: Extension
      collectors:
        - type: directory
          value: 'src/Extension/(Registry|Extension|BuiltinExtension|ConfigurableExtension|ExtensionLoader)\.php'
    - name: Execution
      collectors:
        - type: directory
          value: 'src/Execution/(Pipeline|AtomicWriter|ChangeSet)\.php'
    - name: Reporting
      collectors:
        - type: directory
          value: 'src/Reporting/Reporter\.php'
    - name: Initialization
      collectors:
        - type: directory
          value: 'src/Init/.*'
    - name: Cli
      collectors:
        - type: directory
          value: 'src/Cli/.*'
  ruleset:
    Foundation: [Structuring]
    Collection: [Foundation]
    Structuring: [Foundation]
    Policy: [Foundation, Structuring]
    Configuration: [Foundation, Policy]
    Extension: [Foundation, Structuring]
    Execution: [Foundation, Collection, Extension]
    Reporting: [Foundation]
    Initialization: [Foundation, Structuring, Configuration]
    Cli: [Foundation, Configuration, Extension, Execution, Reporting, Initialization]
