deptrac:
  paths:
    - ./src
  layers:
    - name: Model
      collectors:
        - type: directory
          value: 'src/DocGen/Model/.*'
    - name: Infrastructure
      collectors:
        - type: directory
          value: 'src/DocGen/Infrastructure/.*'
    - name: Analysis
      collectors:
        - type: directory
          value: 'src/DocGen/Analysis/.*'
    - name: Render
      collectors:
        - type: directory
          value: 'src/DocGen/Render/.*'
    - name: Cli
      collectors:
        - type: directory
          value: 'src/DocGen/Cli/.*'
  ruleset:
    Model: []
    Infrastructure: [Model]
    Analysis: [Model, Infrastructure]
    Render: [Model, Infrastructure, Analysis]
    Cli: [Model, Infrastructure, Analysis, Render]
