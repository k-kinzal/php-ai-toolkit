configuration:
  -
    id: phpunit11.beStrictAboutChangesToGlobalState
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutChangesToGlobalState
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.beStrictAboutOutputDuringTests
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutOutputDuringTests
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.beStrictAboutTestsThatDoNotTestAnything
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutTestsThatDoNotTestAnything
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.enforceTimeLimit
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@enforceTimeLimit
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.timeoutForSmallTests
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@timeoutForSmallTests
    level: required
    assert:
      equals: '1'
  -
    id: phpunit11.timeoutForMediumTests
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@timeoutForMediumTests
    level: required
    assert:
      equals: '10'
  -
    id: phpunit11.timeoutForLargeTests
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@timeoutForLargeTests
    level: required
    assert:
      equals: '60'
  -
    id: phpunit11.executionOrder
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@executionOrder
    level: required
    assert:
      equals: 'depends,random'
  -
    id: phpunit11.requireCoverageMetadata
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@requireCoverageMetadata
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.beStrictAboutCoverageMetadata
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@beStrictAboutCoverageMetadata
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.failOnAllIssues
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@failOnAllIssues
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.displayDetailsOnAllIssues
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@displayDetailsOnAllIssues
    level: required
    assert:
      equals: 'true'
  -
    id: phpunit11.shortenArraysForExportThreshold
    file: phpunit11.xml.dist
    format: xml
    select: /phpunit/@shortenArraysForExportThreshold
    level: required
    assert:
      equals: '0'
  -
    id: phpunit11.reporter
    file: phpunit11.xml.dist
    format: xml
    select: '/phpunit/extensions/bootstrap[@class="Toolkit\PhpUnit\TestReporter\AiTestReporterExtension"]/@class'
    level: required
    assert:
      equals: 'Toolkit\PhpUnit\TestReporter\AiTestReporterExtension'
