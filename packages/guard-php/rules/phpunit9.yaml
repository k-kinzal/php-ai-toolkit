configuration:
  -
    id: phpunit9.executionOrder
    message: 'PHPUnit configuration field {select} in {file} must {expectation}. {fix}'
    file: phpunit9.xml.dist
    format: xml
    select: /phpunit/@executionOrder
    level: required
    assert:
      equals: 'depends,random'
