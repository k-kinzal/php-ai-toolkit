configuration:
  -
    id: phpcs.ruleset
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: phpcs.xml.dist
    format: xml
    select: /ruleset/rule/@ref
    level: required
    assert:
      equals: PHPCompatibility
  -
    id: phpcs.test-version
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: phpcs.xml.dist
    format: xml
    select: /ruleset/config[@name="testVersion"]/@name
    level: required
    assert:
      equals: testVersion
