configuration:
  -
    id: fuzz.smoke
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/fuzz:smoke
    level: required
    assert:
      contains: '--max-runs=100'
  -
    id: fuzz.lint
    message: 'Configuration field {select} in {file} must {expectation}. {fix}'
    file: composer.json
    format: json
    select: /scripts/lint
    level: required
    assert:
      not_contains: php-fuzzer
  -
    id: fuzz.workflow
    message: 'The workflow jobs mapping at {select} in {file} must {expectation}. Add a CI job that checks out the project, installs its PHP dependencies and runs composer fuzz:smoke.'
    file: .github/workflows/fuzz.yml
    format: yaml
    select: /jobs
    level: required
    assert:
      present: true
